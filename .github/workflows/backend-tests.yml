name: backend-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && DATABASE_URL=sqlite:///./test.db JWT_SECRET_KEY=ci-test-secret-please-change-123456789 python -m pytest -q
